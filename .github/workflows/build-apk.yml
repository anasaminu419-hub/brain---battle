name: Build Brain Battle APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Brain Battle project
        run: |
          mkdir project
          unzip -q brain-battle-android-ready.zip -d project
          cp -a project/. .
          rm -rf project

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Prepare Capacitor web assets
        run: |
          mkdir -p .output/public
          if [ ! -f .output/public/index.html ]; then
            cat > .output/public/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Brain Battle</title>
            </head>
            <body>
              <div id="root"></div>
            </body>
          </html>
          EOF
          fi

      - name: Upgrade Capacitor to 8.5.0
        run: |
          npm install @capacitor/core@8.5.0 @capacitor/android@8.5.0
          npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Brain-Battle-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
